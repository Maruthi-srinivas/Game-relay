map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format nowsquery '$remote_addr - $request_method $uri $status';

upstream chat {
    least_conn;
    server chat-a:8080 max_fails=3 fail_timeout=10s;
    server chat-b:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/access.log nowsquery;

    location = /actuator/prometheus {
        return 404;
    }

    location / {
        proxy_pass http://chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        access_log /var/log/nginx/ws.log nowsquery;
        proxy_pass http://chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
