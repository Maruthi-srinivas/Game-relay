x-chat: &chat
  build: ./backend
  image: gamechat-chat:local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-gamechat}
    POSTGRES_USER: ${POSTGRES_USER:-gamechat}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamechat}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
    JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamechat}
      POSTGRES_DB: ${POSTGRES_DB:-gamechat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-a:
    <<: *chat

  chat-b:
    <<: *chat

  gateway:
    build: ./gateway
    depends_on:
      - chat-a
      - chat-b
    ports:
      - "8080:80"

  frontend:
    build: ./frontend
    depends_on:
      - gateway
    ports:
      - "8081:80"

volumes:
  postgres_data:
