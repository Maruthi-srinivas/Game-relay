x-chat-env: &chat-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-gamechat}
  POSTGRES_USER: ${POSTGRES_USER:-gamechat}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamechat}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
  JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
  JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
  JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-true}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_ENABLED: "true"
  KAFKA_LOG_LISTENER: "false"
  S3_ENABLED: "true"
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
  S3_BUCKET: gamechat
  PROM_USER: ${PROM_USER:-prom}
  PROM_PASSWORD: ${PROM_PASSWORD:-prompass}

x-chat: &chat
  build: ./backend
  image: gamechat-chat:local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  environment:
    <<: *chat-env

services:
  certs-init:
    image: alpine:3.21
    volumes:
      - ./certs:/certs
      - ./certs/generate.sh:/generate.sh:ro
    entrypoint: ["/bin/sh", "/generate.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamechat}
      POSTGRES_DB: ${POSTGRES_DB:-gamechat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then
            exit 1
          fi
          sleep 1
        done
        mc mb -p local/gamechat || true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}

  chat-a:
    <<: *chat

  chat-b:
    <<: *chat

  audit-consumer:
    <<: *chat
    environment:
      <<: *chat-env
      SPRING_PROFILES_ACTIVE: audit
      KAFKA_LOG_LISTENER: "false"

  gateway:
    build: ./gateway
    depends_on:
      certs-init:
        condition: service_completed_successfully
      chat-a:
        condition: service_started
      chat-b:
        condition: service_started
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:443"

  frontend:
    build: ./frontend
    depends_on:
      certs-init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8081:443"

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.4.2
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - chat-a
      - chat-b
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"

  k6:
    image: grafana/k6:0.57.0
    profiles: ["loadtest"]
    volumes:
      - ./observability/k6:/scripts:ro
    environment:
      BASE_URL: https://gateway
    command: ["run", "/scripts/chat.js"]
    depends_on:
      - gateway

volumes:
  postgres_data:
  minio_data:
  loki_data:
