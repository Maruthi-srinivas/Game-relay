server:
  port: 8080

spring:
  application:
    name: game-chat
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gamechat}
    username: ${POSTGRES_USER:gamechat}
    password: ${POSTGRES_PASSWORD:gamechat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION:86400000}

app:
  chat:
    max-message-length: 2000
    sync-batch-size: 100
    heartbeat-timeout-ms: 60000
    heartbeat-sweep-ms: 15000
    typing-idle-ms: 3000
    presence-ttl-ms: 90000
    presence-sweep-ms: 15000
